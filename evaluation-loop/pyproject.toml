[project]
name = "spe-threat-evals"
version = "0.1.0"
description = "Runs the threat catalog's scenarios against an SPE agent and reports which reproduce"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]
browser = ["playwright>=1.45"]  # threatlab run (connects to your logged-in browser over CDP)

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
