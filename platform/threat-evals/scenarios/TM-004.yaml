# TM-004: Expanded Attack Surface from User-Connected Tool Servers.
# The AG-UI chat offers no tool servers, so its run route cannot exercise this threat (the
# nearest thing, tools in the run input, is TM-005 scenario 5). Open WebUI can; driving it
# with a rogue tool server is not automated yet. What is checked: the precondition.
threat: TM-004
cases:
  - id: user-tool-servers-enabled
    scenario: 1
    title: "Precondition: Open WebUI lets users connect their own tool servers"
    kind: probe
    container: host
    # Unverified against a live instance: the field name is Open WebUI's public /api/config.
    command: "curl -sS -m 8 http://127.0.0.1:8080/api/config"
    indicators:
      - answer_matches: {pattern: "\"enable_direct_connections\"\\s*:\\s*true"}
