---
# Configure and start the WESkit / drs-filer / trs-filer / Traefik stack. The
# sources were cloned and the image builds started by build.yml, the images
# pulled by role prefetch and the certificate made by role tls; each is joined
# here right before it is needed.
- name: Configuration directory
  ansible.builtin.file:
    path: "{{ spe_stack_dir }}/config/weskit_config"
    state: directory
    mode: "0755"

- name: Unchanged config files from the deployment repository
  ansible.builtin.copy:
    src: "{{ spe_stack_dir }}/deployment/weskit_config/{{ item }}"
    dest: "{{ spe_stack_dir }}/config/weskit_config/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: [log-config.yaml, redis.conf]

- name: Files to hide from WESkit
  ansible.builtin.stat:
    path: "{{ spe_data_root }}/{{ item }}"
  loop: "{{ spe_wes_masked_files }}"
  register: wes_mask_stat

# Only files that exist: a bind mount onto a missing path inside a read-only mount stops
# the container from starting, and a canary switch that is off never creates its file.
# The stamp goes into the compose file: a mask is bound to the file's inode, so a file
# rewritten under a new inode re-renders the file, and a changed render recreates the stack.
- name: Masks for the files present on this instance
  ansible.builtin.set_fact:
    wes_masks: "{{ wes_mask_present | map(attribute='item') | list }}"
    wes_mask_stamp: "{{ wes_mask_present | map(attribute='stat.inode') | map('string') | join(' ') }}"
  vars:
    wes_mask_present: "{{ wes_mask_stat.results | selectattr('stat.exists') | list }}"

- name: Canary guard sources and manifest directory
  # The image is built by "Whole stack up" (build: always). canary_check.py is
  # the archive checker's matcher, shared so both find the same tokens. The
  # manifest itself is written by role handoff once the canaries exist; until
  # then the guard runs as a plain proxy.
  when: spe_canary_guard | bool
  block:
    - name: Guard directories
      ansible.builtin.file:
        path: "{{ spe_stack_dir }}/guard/{{ item }}"
        state: directory
        mode: "0755"
      loop: [src, manifest]

    - name: Guard sources
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ spe_stack_dir }}/guard/src/"
        mode: "0644"
      loop:
        - canary_guard/guard.py
        - canary_guard/Dockerfile
        - "{{ playbook_dir }}/../../canary_check/canary_check.py"

- name: Rendered configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: weskit_config.yaml.j2, dest: "{{ spe_stack_dir }}/config/weskit_config/config.yaml" }
    - { src: drs_config.yaml.j2, dest: "{{ spe_stack_dir }}/config/drs_config.yaml" }
    - { src: trs_config.yaml.j2, dest: "{{ spe_stack_dir }}/config/trs_config.yaml" }
    - { src: tls.yaml.j2, dest: "{{ spe_stack_dir }}/deployment/tls.yaml" }
    - { src: compose.install.yaml.j2, dest: "{{ spe_stack_dir }}/deployment/compose.install.yaml" }
  loop_control:
    label: "{{ item.dest | basename }}"
  register: rendered

- name: Validate compose file
  ansible.builtin.command: docker compose -f compose.install.yaml config --quiet
  args:
    chdir: "{{ spe_stack_dir }}/deployment"
  changed_when: false

- name: Stack images pulled (started by role prefetch)
  ansible.builtin.import_role:
    name: prefetch
    tasks_from: wait
  vars:
    spe_prefetch_wait: "{{ spe_stack_images }}"

- name: Databases and broker up
  community.docker.docker_compose_v2:
    project_src: "{{ spe_stack_dir }}/deployment"
    files: [compose.install.yaml]
    services: [database, result_broker, drs-mongodb, trs-mongodb]
    state: present

# One non-looped task: `until` retries reliably on a non-zero rc, whereas
# `until` combined with `loop` does not retry a looped item that exits non-zero,
# so a MongoDB that is a moment slow to accept connections failed the run.
- name: Wait for MongoDB instances
  ansible.builtin.shell: |
    set -e
    for svc in database drs-mongodb trs-mongodb; do
      docker compose -f compose.install.yaml exec -T "$svc" \
        mongo --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -qx 1
    done
  args:
    chdir: "{{ spe_stack_dir }}/deployment"
  register: mongo_ping
  until: mongo_ping.rc == 0
  retries: 60
  delay: 2
  changed_when: false

- name: Images built (started by build.yml)
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ stack_build_jobs.results }}"
  loop_control:
    label: "{{ item.item.image }}"
  register: stack_builds
  until: stack_builds.finished
  retries: 720
  delay: 5
  when: item.ansible_job_id is defined

- name: Initialise WESkit data volumes
  community.docker.docker_compose_v2_run:
    project_src: "{{ spe_stack_dir }}/deployment"
    files: [compose.install.yaml]
    service: weskit-data-init
    cleanup: true
  changed_when: false

- name: Whole stack up
  community.docker.docker_compose_v2:
    project_src: "{{ spe_stack_dir }}/deployment"
    files: [compose.install.yaml]
    state: present
    build: always   # services with a build section (added in a workspace) follow their sources; cached when unchanged
    recreate: "{{ 'always' if rendered.changed or (cert.changed | default(false)) else 'auto' }}"
  register: stack_up
  # weskit-data-init is one-shot (restart: 'no'): every up starts it again and
  # compose reports that as a change. Its copy and chown are idempotent, so only
  # actions on the other services count.
  changed_when: >-
    stack_up.actions | default([]) | rejectattr('id', 'search', '-weskit-data-init-') | list | length > 0

- name: Wait for the three APIs
  ansible.builtin.uri:
    url: "https://{{ spe_api_host }}{{ item }}"
    ca_path: "{{ spe_cert_dir }}/traefik.crt"
    status_code: 200
  loop:
    - /ga4gh/wes/v1/service-info
    - /ga4gh/trs/v2/tools
    - /ga4gh/drs/v1/objects
  register: api_up
  until: api_up.status == 200
  retries: 60
  delay: 3

- name: WESkit worker can read the data mount
  ansible.builtin.command: >-
    docker compose -f compose.install.yaml exec -T --user 35671:35671 submission_worker
    sh -c 'test -r /drs-data && test -x /drs-data'
  args:
    chdir: "{{ spe_stack_dir }}/deployment"
  changed_when: false

- name: Every dataset container reads every masked file as empty
  ansible.builtin.command: >-
    docker compose -f compose.install.yaml exec -T --user 35671:35671 {{ item.service }}
    sh -c 'roots=$1; shift; for f in "$@"; do for root in $roots; do
    test ! -s "$root/$f" || { echo "readable: $root/$f"; exit 1; }; done; done' sh
    {{ item.roots | quote }} {{ wes_masks | map('quote') | join(' ') }}
  args:
    chdir: "{{ spe_stack_dir }}/deployment"
  changed_when: false
  loop:
    - { service: rest, roots: /drs-data /data-share }
    - { service: submission_worker, roots: /drs-data /data-share }
    - { service: monitoring_worker, roots: /drs-data /data-share }
    - { service: monitoring_scheduler, roots: /drs-data /data-share }
    - { service: drs-filer, roots: /drs-data }
  loop_control:
    label: "{{ item.service }}"
  when: wes_masks | length > 0
