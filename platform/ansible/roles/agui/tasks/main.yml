---
# AG-UI agent frontend: chat-ui (Next.js + CopilotKit), agent (Pydantic AI over AG-UI,
# the only holder of the LLM key) and sandbox (open-terminal) in compose project
# spe-frontend, defined in the clone's platform/instance/compose.yml. Runs after
# the workflow stack, like the openwebui role. The settings checks and the image
# builds happened earlier (build.yml, in the background) and are joined here;
# this role writes the configuration and the secret env files and runs
# `spe-apply up`, the same step the workspace's Rebuild button ends with.
- name: Sandbox image built (started by role sandbox)
  ansible.builtin.import_role:
    name: sandbox
    tasks_from: wait

- name: Agent and chat UI images built (started by build.yml)
  ansible.builtin.async_status:
    jid: "{{ agui_build_job.ansible_job_id }}"
  register: agui_builds
  until: agui_builds.finished
  retries: 720
  delay: 5

# --- configuration ------------------------------------------------------------
- name: Agent configuration (serialised, not interpolated)
  ansible.builtin.set_fact:
    agui_agent_config:
      model: >-
        {{ {'provider': spe_agent_model_provider, 'name': spe_agent_model}
           | combine({'base_url': spe_agent_base_url} if spe_agent_model_provider == 'openai_compatible' else {})
           | combine({'allowed_models': spe_agent_allowed_models} if spe_agent_allowed_models | length > 0 else {}) }}
      prompt:
        # roles/sandbox/files of the clone, mounted as a directory: edits are read per run.
        file: /etc/spe-agent/sandbox/system_prompt.txt
        include_sandbox_prompt: "{{ spe_agent_include_sandbox_prompt | bool }}"
      tools:
        surface: "{{ spe_agent_tool_surface }}"
        sandbox_url: http://sandbox:8000
        sandbox_operations: "{{ spe_agent_sandbox_operations }}"
        max_output_bytes: "{{ spe_agent_max_output_bytes | int }}"
      limits:
        request_limit: "{{ spe_agent_request_limit | int }}"
        tool_calls_limit: "{{ spe_agent_tool_calls_limit | int }}"
        total_tokens_limit: "{{ spe_agent_total_tokens_limit | int }}"

- name: agent.yaml
  ansible.builtin.copy:
    content: "# Managed by spe-ansible (role: agui).\n{{ agui_agent_config | to_nice_yaml(sort_keys=false) }}"
    dest: "{{ spe_frontend_dir }}/agent.yaml"
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0644"

- name: Secret-bearing env files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ spe_frontend_dir }}/{{ item.dest }}"
    owner: "{{ spe_ssh_user }}"
    group: "{{ spe_ssh_user }}"
    mode: "0600"
  loop:
    - { src: agent.env.j2, dest: agent.env }
    - { src: chat-ui.env.j2, dest: chat-ui.env }
    - { src: "{{ role_path }}/../openwebui/templates/terminal.env.j2", dest: terminal.env }
  loop_control:
    label: "{{ item.dest }}"
  no_log: true

- name: Validate compose file
  ansible.builtin.command: docker compose -f docker-compose.yml config --quiet
  args:
    chdir: "{{ spe_frontend_dir }}"
  changed_when: false

# Same project as the openwebui role: --remove-orphans replaces its containers; its
# open-webui-data volume is left in place. Waits until the agent and the UI answer.
- name: Frontend stack up (spe-apply up)
  ansible.builtin.command: spe-apply up
  register: agui_apply
  changed_when: "'Created' in agui_apply.stdout or 'Recreated' in agui_apply.stdout or 'Started' in agui_apply.stdout"

- name: No-cost checks (the verify role repeats them and adds the smoke run)
  ansible.builtin.include_tasks: checks.yml
  vars:
    agui_run_smoke: false
