---
# Checks the AG-UI settings and starts the agent and chat UI image builds from
# the clone in the background (npm ci, next build, uv sync and the agent's test
# suite take minutes). main.yml joins them.
- name: AG-UI frontend settings are valid
  ansible.builtin.assert:
    that:
      - spe_agent_model_provider in ['openai_compatible', 'anthropic']
      - spe_agent_model is string and spe_agent_model | length > 0
      - spe_agent_allowed_models | length == 0 or spe_agent_model in spe_agent_allowed_models
      - spe_agent_model_provider != 'openai_compatible' or (spe_agent_base_url | default('', true) | length > 0)
      - spe_agent_tool_surface == 'shell'
      - spe_agent_max_output_bytes | int > 0
      - spe_agent_request_limit | int > 0
      - spe_agent_tool_calls_limit | int > 0
      - spe_agent_total_tokens_limit | int > 0
      - spe_agui_ui_port | int != spe_agui_agent_port | int
      - (spe_agui_ui_port | int) not in [443, spe_webui_local_port | int]
      - (spe_agui_agent_port | int) not in [443, spe_webui_local_port | int]
    fail_msg: >-
      Invalid AG-UI settings: provider openai_compatible (needs spe_agent_base_url) or
      anthropic; spe_agent_model must be one of spe_agent_allowed_models when that list is
      set; tool surface shell; positive limits and output cap; two distinct free ports.

- name: LLM key present
  ansible.builtin.assert:
    that: (spe_agent_llm_key | default('', true) | trim | length) > 0
    fail_msg: >-
      The agent's LLM key is empty. Export SPE_LLM_API_KEY on the controller (any
      provider), or DENBI_LLM_API_KEY (openai_compatible) / ANTHROPIC_API_KEY (anthropic).
      Never commit it.
    quiet: true

# --- images, built on the instance from the clone (role repo ran before) ----
# Fixed tags: Docker's layer cache makes a build with unchanged sources take
# seconds, and compose recreates a container only when its image changed. The
# same builds are what `spe-apply build` runs later from the workspace.
- name: Agent and chat UI images, built in the background
  community.docker.docker_image:
    name: "{{ item.image.split(':')[0] }}"
    tag: "{{ item.image.split(':')[1] }}"
    build:
      path: "{{ spe_repo_dir }}/platform/agui/{{ item.dir }}"
      pull: false
    source: build
    force_source: true
  loop: >-
    {{ [{'image': spe_agui_agent_image, 'dir': 'pydantic-ai-agent'}]
       + ([] if spe_agui_ui_dev | bool else [{'image': spe_agui_ui_image, 'dir': 'copilotkit-chat'}]) }}
  loop_control:
    label: "{{ item.image }}"
  async: 3600
  poll: 0
  register: agui_build_jobs
  changed_when: false   # the join (main.yml) reports the change
